# Replaces the image's default server (T-301): its own error_page line would override an
# http-level one, so the not-found page has to be declared here.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # T-296: relative redirects. nginx adds the trailing slash to /fitur -> /fitur/; an absolute
    # Location would carry the container port (8080) and scheme behind the Coolify proxy.
    absolute_redirect off;

    # Unknown paths get the site's own not-found page, still with status 404.
    error_page 404 /404.html;
}
